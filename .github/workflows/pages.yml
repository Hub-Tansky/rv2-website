# The website (website/, ADR 0029): tests on PRs, deploys to GitHub Pages from main.
# build.yml is a trigger because the tests read the release job's asset names from it.
name: pages
on:
  push:
    branches: [main]
    paths: ["website/**", "tests/website/**", ".github/workflows/pages.yml", ".github/workflows/build.yml"]
  pull_request:
    paths: ["website/**", "tests/website/**", ".github/workflows/pages.yml", ".github/workflows/build.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/website/site.test.mjs
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v5
