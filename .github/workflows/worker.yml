# Map submission service (worker/, ADR 0003): tests on PRs and pushes, deploys to Cloudflare from main.
# Deploy needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/ops/map-submissions.md);
# without them, or before setup wrote the D1 database ID, the deploy job skips itself.
name: worker
on:
  push:
    branches: [main]
    paths: [worker/**, .github/workflows/worker.yml]
  pull_request:
    paths: [worker/**, website/submit-map.*, .github/workflows/worker.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test worker/test/worker.test.mjs
      - name: Bundle check
        working-directory: worker
        run: npx --yes wrangler@4.153.0 deploy --dry-run --outdir "$RUNNER_TEMP/worker-dist"
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check setup
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || grep -q '00000000-0000-0000-0000-000000000000' worker/wrangler.toml; then
            echo "::notice::Map submission service not set up yet (docs/ops/map-submissions.md): skipping deploy"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply database migrations
        if: steps.ready.outputs.ok == 'true'
        working-directory: worker
        run: npx --yes wrangler@4.153.0 d1 migrations apply rv2-map-submissions --remote
      - name: Deploy
        if: steps.ready.outputs.ok == 'true'
        working-directory: worker
        run: npx --yes wrangler@4.153.0 deploy --var "RELEASE:${GITHUB_SHA}"
